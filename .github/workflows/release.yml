name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git-cliff

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          git cliff --current --strip header > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          name: FastTrack ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Update CHANGELOG.md on main
        run: |
          git fetch origin main

          tag_sha=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          main_sha=$(git rev-parse origin/main)

          if [ "$tag_sha" != "$main_sha" ]; then
            echo "Tag $GITHUB_REF_NAME is not the current main head; skipping CHANGELOG.md update."
            exit 0
          fi

          git switch -C main origin/main
          git cliff --output CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): update CHANGELOG for ${{ github.ref_name }}"
          git push origin HEAD:main
