name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish with the current workflow
        required: true
        type: string

jobs:
  release:
    name: Update GitHub Release notes
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          git cliff --tag "$RELEASE_TAG" --strip header > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Update GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md --title "FastTrack $RELEASE_TAG"
