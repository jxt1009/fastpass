name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish with the current workflow
        required: true
        type: string

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0  # full history needed for git-cliff

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git cliff --tag "$RELEASE_TAG" --strip header > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          name: FastTrack ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}

      - name: Update CHANGELOG.md on main
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch origin main

          tag_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          main_sha=$(git rev-parse origin/main)

          if [ "$tag_sha" != "$main_sha" ]; then
            echo "Tag $RELEASE_TAG is not the current main head; skipping CHANGELOG.md update."
            exit 0
          fi

          git switch -C main origin/main
          git cliff --output CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): update CHANGELOG for $RELEASE_TAG"
          git push origin HEAD:main
