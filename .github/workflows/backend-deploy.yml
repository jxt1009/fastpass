name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
      - '.github/actions/k8s-deploy/**'

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      sha: ${{ steps.version.outputs.sha }}
      image: ghcr.io/${{ github.repository_owner }}/fasttrack-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version info
        id: version
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fasttrack-backend:latest
            ghcr.io/${{ github.repository_owner }}/fasttrack-backend:${{ steps.version.outputs.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        uses: ./.github/actions/k8s-deploy
        with:
          namespace: fasttrack-staging
          kubeconfig: ${{ secrets.KUBECONFIG }}
          kustomize-dir: backend/k8s/overlays/staging
          image: ghcr.io/${{ github.repository_owner }}/fasttrack-backend:${{ needs.build.outputs.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          database-url: ${{ secrets.STAGING_DATABASE_URL }}
          jwt-secret: ${{ secrets.JWT_SECRET }}
          apple-app-bundle-id: ${{ secrets.APPLE_APP_BUNDLE_ID }}
          base-url: ${{ secrets.STAGING_BASE_URL }}
          google-client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google-client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}

  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        uses: ./.github/actions/k8s-deploy
        with:
          namespace: fasttrack-production
          kubeconfig: ${{ secrets.KUBECONFIG }}
          kustomize-dir: backend/k8s/overlays/production
          image: ghcr.io/${{ github.repository_owner }}/fasttrack-backend:${{ needs.build.outputs.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          database-url: ${{ secrets.PRODUCTION_DATABASE_URL }}
          jwt-secret: ${{ secrets.JWT_SECRET }}
          apple-app-bundle-id: ${{ secrets.APPLE_APP_BUNDLE_ID }}
          base-url: ${{ secrets.PRODUCTION_BASE_URL }}
          google-client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google-client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
