name: iOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (leave empty to use IOS_VERSION file)'
        required: false
        type: string

jobs:
  testflight:
    name: Upload to TestFlight
    if: |
      (github.event_name == 'push' && !contains(github.ref_name, '-')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: macos-26
    env:
      FASTTRACK_APP_IDENTIFIER: com.toper.FastTrack
      MATCH_GIT_URL: https://github.com/jxt1009/fasttrack-secrets.git
      APPLE_ID: ${{ secrets.APPLE_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      FASTLANE_KEYCHAIN_PASSWORD: fasttrack-fastlane

    defaults:
      run:
        working-directory: ios/FastTrack

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/FastTrack

      - name: Create Secrets.swift from template
        env:
          IOS_GOOGLE_CLIENT_ID: ${{ secrets.IOS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          cp FastTrack/Secrets.swift.template FastTrack/Secrets.swift

          client_id="${IOS_GOOGLE_CLIENT_ID:-$GOOGLE_CLIENT_ID}"
          if [ -z "$client_id" ]; then
            echo "::error::Missing required GitHub Actions secret: IOS_GOOGLE_CLIENT_ID (or fallback GOOGLE_CLIENT_ID)"
            exit 1
          fi

          CLIENT_ID="$client_id" python3 <<'PY'
          import os
          import pathlib

          path = pathlib.Path("FastTrack/Secrets.swift")
          placeholder = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
          client_id = os.environ["CLIENT_ID"].strip()
          content = path.read_text(encoding="utf-8")
          if placeholder not in content:
            raise SystemExit("::error::Expected Google client ID placeholder not found in FastTrack/Secrets.swift")
          path.write_text(content.replace(placeholder, client_id), encoding="utf-8")
          PY

      - name: Validate release secrets
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          IOS_GOOGLE_CLIENT_ID: ${{ secrets.IOS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          missing=0
          for key in \
            APP_STORE_CONNECT_API_KEY \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APPLE_ID \
            TEAM_ID \
            MATCH_PASSWORD \
            MATCH_GIT_BASIC_AUTHORIZATION
          do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub Actions secret: $key"
              missing=1
            fi
          done

          if [ -z "${IOS_GOOGLE_CLIENT_ID:-$GOOGLE_CLIENT_ID}" ]; then
            echo "::error::Missing required GitHub Actions secret: IOS_GOOGLE_CLIENT_ID (or fallback GOOGLE_CLIENT_ID)"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          key_path="$HOME/.fastlane/AuthKey.p8"
          mkdir -p "$(dirname "$key_path")" "$HOME/.fastlane/spaceship"

          KEY_PATH="$key_path" python3 <<'PY'
          import base64
          import json
          import os
          import pathlib
          import sys

          raw = os.environ["APP_STORE_CONNECT_API_KEY"]
          key_path = pathlib.Path(os.environ["KEY_PATH"])

          candidates = [raw, raw.strip()]

          stripped = raw.strip()
          if stripped.startswith("{"):
            try:
              payload = json.loads(stripped)
            except json.JSONDecodeError:
              payload = None
            if isinstance(payload, dict):
              for field in ("key", "key_content", "api_key"):
                value = payload.get(field)
                if isinstance(value, str):
                  candidates.append(value)

          def normalize(value: str) -> str:
            value = value.strip().replace("\r\n", "\n").replace("\r", "\n")
            if len(value) >= 2 and value[0] == value[-1] and value[0] in {"'", '"'}:
              value = value[1:-1]
            value = value.replace("\\n", "\n")
            return value.strip() + "\n"

          def looks_like_pem(value: str) -> bool:
            return value.startswith("-----BEGIN PRIVATE KEY-----\n") and "-----END PRIVATE KEY-----" in value

          def decode_base64(value: str) -> str | None:
            compact = "".join(value.split())
            if not compact:
              return None
            try:
              decoded = base64.b64decode(compact, validate=True)
            except Exception:
              return None
            try:
              return decoded.decode("utf-8")
            except UnicodeDecodeError:
              return None

          for candidate in list(candidates):
            for value in (candidate.strip(), normalize(candidate).strip()):
              if "=" not in value:
                continue
              prefix, suffix = value.split("=", 1)
              if prefix in {"APP_STORE_CONNECT_API_KEY", "APP_STORE_CONNECT_API_KEY_BASE64"}:
                candidates.append(suffix)

          pem = None
          for candidate in candidates:
            normalized = normalize(candidate)
            if looks_like_pem(normalized):
              pem = normalized
              break

            for value in (candidate, normalized.strip()):
              decoded = decode_base64(value)
              if decoded:
                normalized = normalize(decoded)
                if looks_like_pem(normalized):
                  pem = normalized
                  break
            if pem:
              break

          if pem is None:
            print("::error::APP_STORE_CONNECT_API_KEY is not recognizable as an App Store Connect .p8 private key.", file=sys.stderr)
            print("::error::Paste the raw .p8 contents, the same contents with \\\\n escapes, a JSON payload containing `key`, or a base64-encoded .p8 file.", file=sys.stderr)
            sys.exit(1)

          key_path.write_text(pem, encoding="utf-8")
          PY

          openssl pkey -in "$key_path" -noout >/dev/null 2>&1 || {
            echo "::error::APP_STORE_CONNECT_API_KEY did not decode to a valid EC private key. Re-copy the downloaded AuthKey_*.p8 contents into the repository secret."
            exit 1
          }

          echo "APP_STORE_CONNECT_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Read marketing version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
          elif [ -f FastTrack/IOS_VERSION ]; then
            echo "version=$(cat FastTrack/IOS_VERSION)" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Fetch and normalize release notes for TestFlight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_ref="$GITHUB_REF_NAME"
          if [[ "$release_ref" != v* ]]; then
            release_ref="v${{ steps.version.outputs.version }}"
          fi

          for i in $(seq 1 10); do
            notes=$(gh release view "$release_ref" --json body --jq '.body' 2>/dev/null || true)
            if [ -n "$notes" ]; then
              transformed=$(printf '%s' "$notes" | python3 scripts/prepare_testflight_notes.py --max-chars 4000)
              if [ -n "$transformed" ]; then
                {
                  echo "FL_WHATS_NEW<<EOF"
                  printf '%s' "$transformed"
                  echo ""
                  echo "EOF"
                } >> "$GITHUB_ENV"
                echo "Prepared TestFlight notes (${#transformed} chars)"
              else
                echo "::warning::Release notes were found for $release_ref but produced no user-facing TestFlight notes."
              fi
              exit 0
            fi
            echo "Release not yet available, retrying in 2s (attempt $i/10)..."
            sleep 2
          done
          echo "::warning::Release notes not found for $release_ref; TestFlight 'What to Test' will be empty."

      - name: Run Fastlane beta
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          FL_VERSION_NUMBER: ${{ steps.version.outputs.version }}
        run: bundle exec fastlane beta
