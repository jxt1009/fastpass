apiVersion: v1
kind: ConfigMap
metadata:
  name: fasttrack-postgres-init
  namespace: default
  labels:
    app.kubernetes.io/part-of: fasttrack
data:
  create-staging-db.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 'CREATE DATABASE fasttrack_staging'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'fasttrack_staging')\\gexec
    EOSQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fasttrack-postgres-pvc
  namespace: default
  labels:
    app.kubernetes.io/part-of: fasttrack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fasttrack-postgres
  namespace: default
  labels:
    app: fasttrack-postgres
    app.kubernetes.io/part-of: fasttrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fasttrack-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: fasttrack-postgres
        app.kubernetes.io/part-of: fasttrack
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: fasttrack_production
        - name: POSTGRES_USER
          value: fasttrack
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fasttrack-postgres-secret
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: postgres-backup
          mountPath: /backups
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - fasttrack
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - fasttrack
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: fasttrack-postgres-pvc
      - name: postgres-backup
        persistentVolumeClaim:
          claimName: fasttrack-postgres-backup-pvc
      - name: init-scripts
        configMap:
          name: fasttrack-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: fasttrack-postgres-service
  namespace: default
  labels:
    app.kubernetes.io/part-of: fasttrack
spec:
  selector:
    app: fasttrack-postgres
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fasttrack-postgres-backup-pvc
  namespace: default
  labels:
    app.kubernetes.io/part-of: fasttrack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
